# After a packages release is published: fetch it as Rutba Office would and
# check every signature, size and hash, the feed's readiness fields, the pin
# against Office's tag, and English against the copy Office carries
# (tools/verify-release.mjs). It holds no key and uses no secret.
name: Verify a published release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to check, such as v2.26.0'
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone the Office release the packages are pinned to
        run: |
          repo=$(node -p "require('./office.json').repo")
          tag=$(node -p "require('./office.json').tag")
          git clone --quiet --depth 1 --branch "$tag" "$repo" .cache/office
      - name: Check the release as published
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        # The public keys come only from the contract in Office's tag (its `keys`).
        run: node tools/verify-release.mjs --version "${TAG#v}" --office .cache/office
